name: Deploy mapas (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - 'maps/**'
      - '.github/workflows/deploy-maps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mapas
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maps/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maps/worker/package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Desplegar Worker y rutas
        run: npx wrangler deploy --config wrangler.toml

      - name: Configurar secretos del Worker
        env:
          CORDILLERA_PASSPHRASE: ${{ secrets.CORDILLERA_PASSPHRASE }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          for NAME in CORDILLERA_PASSPHRASE SESSION_SECRET ADMIN_TOKEN; do
            VALUE="${!NAME:-}"
            if [ -z "$VALUE" ]; then
              echo "Falta el secreto $NAME en el repositorio." >&2
              exit 1
            fi
            printf '%s' "$VALUE" | npx wrangler secret put "$NAME" --config wrangler.toml
          done
