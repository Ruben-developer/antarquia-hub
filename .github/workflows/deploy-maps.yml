name: Deploy mapas (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - 'maps/**'
      - '.github/workflows/deploy-maps.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mapas
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maps/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maps/worker/package-lock.json

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      - name: Crear o reutilizar el namespace KV
        run: |
          set -euo pipefail
          ID="$(npx wrangler kv namespace list --json | node -e '
            let s = "";
            process.stdin.on("data", d => s += d).on("end", () => {
              try {
                const list = JSON.parse(s);
                const found = list.find(x => x.title === "mapas-antarquia");
                if (found) process.stdout.write(found.id);
              } catch (e) {}
            });
          ')"
          if [ -z "$ID" ]; then
            echo "Creando namespace mapas-antarquia…"
            OUT="$(npx wrangler kv namespace create mapas-antarquia)"
            ID="$(printf '%s\n' "$OUT" | sed -n 's/.*id = "\([^"]*\)".*/\1/p' | head -1)"
          fi
          if [ -z "$ID" ]; then
            echo "No se pudo obtener el id del namespace KV." >&2
            exit 1
          fi
          echo "KV id: $ID"
          sed -i "s/__KV_ID__/$ID/g" wrangler.toml

      - name: Desplegar Worker y rutas
        run: npx wrangler deploy --config wrangler.toml

      - name: Configurar secretos del Worker
        env:
          CORDILLERA_PASSPHRASE: ${{ secrets.CORDILLERA_PASSPHRASE }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          for NAME in CORDILLERA_PASSPHRASE SESSION_SECRET ADMIN_TOKEN; do
            VALUE="${!NAME:-}"
            if [ -z "$VALUE" ]; then
              echo "Falta el secreto $NAME en el repositorio." >&2
              exit 1
            fi
            printf '%s' "$VALUE" | npx wrangler secret put "$NAME" --config wrangler.toml
          done
