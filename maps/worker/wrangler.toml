name = "mapas-antarquia"
main = "index.js"
compatibility_date = "2026-11-09"

[assets]
directory = "../site"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = true

[[durable_objects.bindings]]
name = "MAPS"
class_name = "MapStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MapStore"]

[[routes]]
pattern = "cartografia.antarquia.cl"
custom_domain = true

[[routes]]
pattern = "cordillera.antarquia.cl"
custom_domain = true

[vars]
APP_NAME = "Mapas Antarquía"
